{% extends 'layout.html' %}{% block title %}Book Dental Appointment | {{config.CLINIC_NAME}}{% endblock %}{% block content %}<section class="page-hero"><div class="container"><span class="eyebrow">Appointments</span><h1>Request an Appointment</h1><p>Send your preferred date and time. Our clinic team will contact you to confirm availability.</p></div></section><section class="section"><div class="container"><form method="post" class="form-card mx-auto"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label>Patient Name *</label><input class="form-control" name="patient_name" required></div><div class="col-md-6"><label>Phone Number *</label><input class="form-control" name="phone" required></div><div class="col-md-6"><label>Email Address</label><input class="form-control" type="email" name="email"></div><div class="col-md-6"><label>Treatment Required</label><select class="form-select" name="treatment_id"><option value="">Select treatment</option>{% for t in treatments %}<option value="{{t.id}}">{{t.name}}</option>{% endfor %}</select></div><div class="col-md-3"><label>Preferred Date *</label><input class="form-control" type="date" name="appointment_date" required></div><div class="col-md-3"><label>Preferred Time *</label><input class="form-control" type="time" name="appointment_time" required></div><div class="col-12"><label>Message / Dental Concern</label><textarea class="form-control" rows="5" name="message"></textarea></div><div class="col-12 d-flex flex-wrap gap-2"><button class="btn btn-primary rounded-pill px-4">Request Appointment</button><a target="_blank" class="btn btn-success rounded-pill" href="https://wa.me/{{config.CLINIC_WHATSAPP}}?text=Hello%2C%20I%20would%20like%20to%20book%20a%20dental%20appointment."><i class="bi bi-whatsapp"></i> Book via WhatsApp</a></div></div></form></div></section>{% endblock %}
